name: Extract Crampon Rosary Corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/extract_crampon_chapters_v1.py'
      - 'tools/extract_crampon_rosary.py'
      - 'tools/compact_crampon_rosary.py'
      - 'tools/rosary_refs_en.json'
      - '.github/workflows/extract-crampon-rosary.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and verify pinned Crampon chapters
        shell: bash
        run: |
          mkdir -p data
          python tools/extract_crampon_chapters_v1.py | tee data/crampon-rosary-extract.log

      - name: Build 200 source-locked Rosary cues
        shell: bash
        run: |
          python tools/extract_crampon_rosary.py | tee data/crampon-rosary-cues-extract.log

      - name: Build compact runtime payload
        shell: bash
        run: python tools/compact_crampon_rosary.py

      - name: Commit generated corpus and cue dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/crampon-rosary-extract.log \
            data/crampon-rosary-chapters-v1.json \
            data/crampon-rosary-chapters-v1-report.json \
            data/crampon-rosary-split-source-v1.json \
            data/crampon-rosary-cues-extract.log \
            data/rosary-scripture-fr-crampon-v1.json \
            data/rosary-scripture-fr-crampon-v1-audit.json \
            data/rosary-scripture-fr-crampon-v1.compact.json
          if git diff --cached --quiet; then
            echo "No corpus/cue changes"
          else
            git commit -m "Generate source-locked Crampon Rosary Scripture dataset"
            git push
          fi
