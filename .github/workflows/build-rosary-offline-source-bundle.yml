name: Temporary build Rosary offline source bundle

on:
  push:
    paths:
      - '.github/workflows/build-rosary-offline-source-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact bounded source bundle
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          CATENA_COMMIT = "efe1bd084d918a34ca22ffeef2ecf711c593b392"
          EXPECTED_BLOBS = {
              "john":"cc99fe62a303aadfd3fcfea79429103cf80b5acd",
              "luke":"57cad8bab1624b2fc3559868513a963622eae492",
              "mark":"efeb0ee731a0631c8d15bc1a41891a6178210272",
              "matthew":"7c19218587120dd9cf8efb51826fca8d13bb884e",
          }
          REQUIRED = set(["catena.john.1.29", "catena.john.1.32", "catena.john.18.33", "catena.john.18.38", "catena.john.19.1", "catena.john.19.12", "catena.john.19.16", "catena.john.19.24", "catena.john.19.28", "catena.john.19.31", "catena.john.2.1", "catena.john.2.5", "catena.john.20.1", "catena.john.20.10", "catena.john.20.19", "catena.john.20.26", "catena.john.3.1", "catena.john.3.4", "catena.john.6.35", "catena.john.6.47", "catena.john.6.52", "catena.john.6.55", "catena.luke.1.26", "catena.luke.1.28", "catena.luke.1.30", "catena.luke.1.34", "catena.luke.1.36", "catena.luke.1.39", "catena.luke.1.46", "catena.luke.1.47", "catena.luke.1.48", "catena.luke.1.49", "catena.luke.1.50", "catena.luke.1.51", "catena.luke.1.52", "catena.luke.1.53", "catena.luke.1.54", "catena.luke.1.56", "catena.luke.15.1", "catena.luke.2.1", "catena.luke.2.13", "catena.luke.2.15", "catena.luke.2.22", "catena.luke.2.28", "catena.luke.2.33", "catena.luke.2.36", "catena.luke.2.39", "catena.luke.2.42", "catena.luke.2.51", "catena.luke.2.6", "catena.luke.2.8", "catena.luke.22.14", "catena.luke.22.39", "catena.luke.22.43", "catena.luke.23.13", "catena.luke.23.26", "catena.luke.23.33", "catena.luke.23.34", "catena.luke.23.38", "catena.luke.23.44", "catena.luke.24.50", "catena.luke.3.21", "catena.luke.4.14", "catena.luke.9.28", "catena.luke.9.32", "catena.mark.1.14", "catena.mark.16.19", "catena.matthew.10.5", "catena.matthew.16.24", "catena.matthew.17.1", "catena.matthew.17.5", "catena.matthew.26.26", "catena.matthew.26.27", "catena.matthew.26.36", "catena.matthew.26.39", "catena.matthew.26.45", "catena.matthew.27.15", "catena.matthew.27.27", "catena.matthew.27.31", "catena.matthew.28.16", "catena.matthew.3.13", "catena.matthew.5.1", "catena.matthew.6.31"])
          out = pathlib.Path("offline-source-bundle")
          out.mkdir(exist_ok=True)

          cue_path = pathlib.Path("data/rosary-scripture-fr-crampon-v1.compact.json")
          chapter_path = pathlib.Path("data/crampon-rosary-chapters-v1.json")
          cues = json.loads(cue_path.read_text(encoding="utf-8"))
          chapters = json.loads(chapter_path.read_text(encoding="utf-8"))
          expected_crampon = "d00e7f91c6f20c9e5c6a970deb655bf041dcfdbd"
          assert cues.get("schema") == "labora.rosary.scripture.fr.crampon.compact.v1"
          assert cues.get("count") == 200
          assert cues.get("source", {}).get("git_blob_sha") == expected_crampon
          assert sum(len(v) for v in cues.get("cues", {}).values()) == 200
          meta = chapters.get("metadata", {})
          assert meta.get("source_verified") is True
          assert meta.get("source_git_blob_sha1") == expected_crampon
          assert meta.get("required_chapter_count") == 39
          chapter_tree = chapters.get("chapters", {})
          def count_chapter_nodes(x):
              if isinstance(x, dict) and isinstance(x.get("verses"), dict):
                  return 1
              if isinstance(x, dict):
                  return sum(count_chapter_nodes(v) for v in x.values())
              if isinstance(x, list):
                  return sum(count_chapter_nodes(v) for v in x)
              return 0
          assert count_chapter_nodes(chapter_tree) == 39
          (out/cue_path.name).write_bytes(cue_path.read_bytes())
          (out/chapter_path.name).write_bytes(chapter_path.read_bytes())

          nodes = {}
          source_sha256 = {}
          for gospel in ("john","luke","mark","matthew"):
              url = f"https://raw.githubusercontent.com/AlvaroBalbin/catena/{CATENA_COMMIT}/data/catena/{gospel}.jsonl"
              with urllib.request.urlopen(url, timeout=60) as r:
                  raw = r.read()
              source_sha256[gospel] = hashlib.sha256(raw).hexdigest()
              for line in raw.decode("utf-8").splitlines():
                  if not line.strip():
                      continue
                  node = json.loads(line)
                  ident = node.get("id")
                  if ident in REQUIRED:
                      if ident in nodes:
                          raise RuntimeError(f"Duplicate Catena id: {ident}")
                      for field in ("lemma","text","segments"):
                          if field not in node or node[field] in (None,"",[]):
                              raise RuntimeError(f"Missing {field} for {ident}")
                      if not isinstance(node["segments"], list) or not all(isinstance(s, dict) and s.get("text") for s in node["segments"]):
                          raise RuntimeError(f"Invalid ordered segments for {ident}")
                      nodes[ident] = node
          missing = sorted(REQUIRED - nodes.keys())
          extra = sorted(nodes.keys() - REQUIRED)
          if missing or extra or len(nodes) != 83:
              raise RuntimeError(f"Catena subset mismatch: found={len(nodes)} missing={missing} extra={extra}")
          fragment_count = sum(len(n["segments"]) for n in nodes.values())
          catena = {
              "schema":"labora.rosary.catena.newman.compact.v1",
              "count":83,
              "fragment_count":fragment_count,
              "source":{
                  "repository":"AlvaroBalbin/catena",
                  "commit":CATENA_COMMIT,
                  "edition":"Catena Aurea, Oxford English translation edited by John Henry Newman, 1841-45",
                  "source_file_git_blobs":EXPECTED_BLOBS,
                  "downloaded_file_sha256":source_sha256,
              },
              "nodes":dict(sorted(nodes.items())),
          }
          catena_path = out/"rosary-catena-newman-83.compact.json"
          catena_path.write_text(json.dumps(catena, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          qa = {
              "crampon_cues":200,
              "crampon_chapters":39,
              "catena_nodes":len(nodes),
              "catena_fragments":fragment_count,
              "catena_commit":CATENA_COMMIT,
              "no_generated_commentary":True,
          }
          (out/"OFFLINE-SOURCE-BUNDLE-QA.json").write_text(json.dumps(qa,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(qa, indent=2))
          PY
      - name: Upload bounded offline source bundle
        uses: actions/upload-artifact@v4
        with:
          name: rosary-offline-source-bundle
          path: offline-source-bundle/
          if-no-files-found: error
          retention-days: 7
