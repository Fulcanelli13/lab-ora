name: Build Crampon Rosary Cues

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_crampon_rosary_cues_v1.py'
      - 'data/crampon-rosary-chapters-v1.json'
      - 'data/rosary-scripture-reference-contract-v1.json'
      - '.github/workflows/build-crampon-rosary-cues.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate Crampon Rosary cues
        run: python tools/build_crampon_rosary_cues_v1.py
      - name: Commit validated cue and chapter shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crampon-cues data/crampon-chapters data/crampon-rosary-cues-v1-report.json
          if git diff --cached --quiet; then
            echo "No cue changes"
          else
            git commit -m "Build verified Crampon Rosary cues"
            git push
          fi
